# Laptop display layout.
# Symlinked to ~/.config/hypr/monitors.conf by: dots sync --machine laptop
#
# Written by `dots monitor save`. Left as the built-in panel only: an external
# display plugged into a laptop is the case the wildcard in hyprland.conf
# already handles (preferred mode, auto position), and pinning a rule for a
# monitor that is usually absent is how you end up with a black screen at a
# conference.
#
# monitor = NAME, WIDTHxHEIGHT@HZ, XxY, SCALE

monitor = eDP-1, preferred, 0x0, 1.0
