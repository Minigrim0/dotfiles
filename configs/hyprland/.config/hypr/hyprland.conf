# =============================================================================
# Hyprland configuration
# Machine-specific overrides live in machine.conf (symlinked by dots)
# Color variables live in colors.conf (generated by matugen)
# =============================================================================

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/machine.conf

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------

$terminal    = kitty
$fileManager = caja
$menu        = wofi --show drun
$mainMod     = SUPER

# ---------------------------------------------------------------------------
# Monitor
# ---------------------------------------------------------------------------

monitor = ,preferred,auto,1

# ---------------------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------------------

exec-once = waybar
exec-once = dunst
exec-once = awww-daemon
exec-once = nm-applet
exec-once = nextcloud
exec-once = udiskie --notify --tray
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = RUST_LOG=dots=info dots daemon

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic

# ---------------------------------------------------------------------------
# Look & feel
# ---------------------------------------------------------------------------

general {
    gaps_in        = 5
    gaps_out       = 10
    border_size    = 2
    col.active_border   = $accent
    col.inactive_border = $surface
    resize_on_border    = true
    allow_tearing       = true
    layout              = dwindle
}

decoration {
    rounding       = 5
    rounding_power = 2
    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled   = true
        size      = 3
        passes    = 1
        vibrancy  = 0.17
    }
}

animations {
    enabled = true

    bezier = easeOutQuint,    0.23, 1,    0.32, 1
    bezier = easeInOutCubic,  0.65, 0.05, 0.36, 1
    bezier = linear,          0,    0,    1,    1
    bezier = almostLinear,    0.5,  0.5,  0.75, 1.0
    bezier = quick,           0.15, 0,    0.1,  1

    animation = global,        1, 10,  default
    animation = border,        1, 5,   easeOutQuint
    animation = windows,       1, 5,   easeOutQuint
    animation = windowsIn,     1, 4,   easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.5, linear,       popin 87%
    animation = fadeIn,        1, 2,   almostLinear
    animation = fadeOut,       1, 1.5, almostLinear
    animation = fade,          1, 3,   quick
    animation = layers,        1, 4,   easeOutQuint
    animation = layersIn,      1, 4,   easeOutQuint, fade
    animation = layersOut,     1, 1.5, linear,       fade
    animation = workspaces,    1, 2,   almostLinear, fade
    animation = workspacesIn,  1, 1.2, almostLinear, fade
    animation = workspacesOut, 1, 2,   almostLinear, fade
}

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1],   gapsout:0, gapsin:0

dwindle {
    pseudotile     = true
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = true
}

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------

input {
    kb_layout  = fr(us)
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

# ---------------------------------------------------------------------------
# Keybinds
# ---------------------------------------------------------------------------

# Core
bind = $mainMod,       Return,  exec,         $terminal
bind = $mainMod SHIFT, A,       killactive
bind = $mainMod,       F,       fullscreen
bind = $mainMod,       M,       exit
bind = $mainMod,       V,       togglefloating
bind = $mainMod,       D,       exec,         $menu
bind = $mainMod,       E,       exec,         wofi-emoji
bind = $mainMod,       P,       pseudo
bind = $mainMod,       L,       exec,         hyprlock

# Screenshot
bind = $mainMod SHIFT, F,       exec,         hyprshot -m region

# TUI tools
bind = $mainMod SHIFT, B,       exec,         $terminal -e bluetui
bind = $mainMod SHIFT, N,       exec,         $terminal -e nmtui

# Focus
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move windows
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize windows
bind = $mainMod CTRL, left,  resizeactive, -10 0
bind = $mainMod CTRL, right, resizeactive,  10 0
bind = $mainMod CTRL, up,    resizeactive,  0 -10
bind = $mainMod CTRL, down,  resizeactive,  0  10

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Special workspace
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,         special:magic

# Media / volume  (wpctl)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume    @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@   toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Player controls
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------

windowrule = float on,             match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on,             match:title ^([eE]xtension:.+Bitwarden.+)$
windowrule = suppress_event maximize, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Gaming: allow tearing (direct scanout) for fullscreen games
windowrule = immediate on, match:fullscreen 1
