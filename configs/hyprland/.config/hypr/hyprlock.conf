background {
    monitor     =
    path        = screenshot
    blur_passes = 2
    blur_size   = 4
}

label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +%H:%M)"
    color       = rgba(230, 225, 229, 1.0)
    font_size   = 80
    font_family = AnonymicePro Nerd Font Bold
    halign      = center
    valign      = center
    position    = 0, 120
}

label {
    monitor     =
    text        = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color       = rgba(230, 225, 229, 0.6)
    font_size   = 18
    font_family = AnonymicePro Nerd Font
    halign      = center
    valign      = center
    position    = 0, 60
}

input-field {
    halign = center
    valign = center
}
