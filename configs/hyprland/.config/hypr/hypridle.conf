# =============================================================================
# hypridle — idle chain: lock at 10 min, screens off at 15, suspend (laptop
# only) at 30. Suspend decision lives in scripts/suspend-if-laptop.sh.
# =============================================================================

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout    = 1800
    on-timeout = ~/.config/hypr/scripts/suspend-if-laptop.sh
}
