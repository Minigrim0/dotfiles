[Settings]
# Font comes from the same family as the desktop chrome (see configs/fonts).
gtk-font-name=Adwaita Sans 10

# Adwaita / Adwaita-dark is also what `dots theme` sets over gsettings, so the
# two agree. prefer-dark is flipped by `dots theme dark|light`.
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Adwaita

# Matches XCURSOR_THEME / XCURSOR_SIZE in hyprland.conf.
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24

gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-primary-button-warps-slider=true
gtk-toolbar-style=3
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
