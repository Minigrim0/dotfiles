[config]
reload_apps = false   # we handle reloads ourselves in dots wallpaper set

[templates.waybar-colors]
input_path  = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"

[templates.hyprland-colors]
input_path  = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.kitty-colors]
input_path  = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"

[templates.dunst-colors]
input_path  = "~/.config/matugen/templates/dunst-colors.ini"
output_path = "~/.config/dunst/colors.ini"

[templates.gtk3-colors]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4-colors]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.wofi]
input_path  = "~/.config/matugen/templates/wofi.css"
output_path = "~/.config/wofi/style.css"

[templates.wofi-menu]
input_path  = "~/.config/matugen/templates/wofi-menu.css"
output_path = "~/.config/wofi/menu.css"

[templates.wlogout]
input_path  = "~/.config/matugen/templates/wlogout.css"
output_path = "~/.config/wlogout/style.css"

[templates.swayosd]
input_path  = "~/.config/matugen/templates/swayosd.css"
output_path = "~/.config/swayosd/style.css"

# Qt. Two outputs from one template: Qt5 and Qt6 read the same palette format,
# but each version's platform theme plugin only looks in its own directory.
[templates.qt6ct-colors]
input_path  = "~/.config/matugen/templates/qt-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.qt5ct-colors]
input_path  = "~/.config/matugen/templates/qt-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"
