[meta]
version = "1"

# ---------------------------------------------------------------------------
# Core desktop
# ---------------------------------------------------------------------------

[modules.hyprland]
enabled = true
packages = [
    "hyprland",
    "hyprlock",
    "hypridle",
    "hyprsunset",
    "hyprpicker",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "polkit-kde-agent",
    "playerctl",
    "hyprshot",
    "satty",
    "wl-clipboard",
    "cliphist",
    # drag-and-drop monitor arrangement; `dots monitor` covers the rest
    "nwg-displays",
]

[modules.login]
enabled = true
# SDDM is the greeter; uwsm is what makes the session a real systemd session.
# Picking "Hyprland (uwsm-managed)" at the greeter is what activates it —
# see `dots doctor`, which reports which of the two you actually logged into.
packages = ["sddm", "uwsm"]
configs = "uwsm"
hooks.post_install = ["sudo systemctl enable sddm"]

[modules.bar]
enabled = true
configs = "waybar"
packages = ["waybar"]

[modules.launcher]
enabled = true
configs = "wofi"
packages = ["wofi"]
aur_packages = ["wofi-emoji"]

[modules.notifications]
enabled = true
configs = "dunst"
packages = ["dunst", "libnotify"]

[modules.daemon]
enabled = true
configs = "systemd"
packages = []
hooks.post_install = ["systemctl --user daemon-reload", "systemctl --user enable dots.service"]

[modules.osd]
enabled = true
packages = ["swayosd"]

[modules.session]
enabled = true
configs = "wlogout"
packages = []
aur_packages = ["wlogout"]

[modules.wallpaper]
enabled = true
configs = "matugen"
packages = ["matugen", "ffmpeg"]
# aur_packages = ["awww-bin"]

[modules.terminal]
enabled = true
configs = "kitty"
packages = ["kitty"]

# Shell

[modules.shell]
enabled = true
packages = [
    "zsh",
    "zsh-autosuggestions",
    "zsh-syntax-highlighting",
    "starship",
    "zoxide",
]
hooks.post_install = ["chsh -s /bin/zsh"]

# Fonts & theme

[modules.fonts]
enabled = true
configs = "fonts"
packages = [
    # interface — Adwaita Sans (an Inter derivative, matches GTK apps)
    "adwaita-fonts",
    # data / code — kitty, and the numeric modules in waybar
    "ttf-jetbrains-mono-nerd",
    # glyphs — lets the UI use a real sans and still render Nerd Font icons
    "ttf-nerd-fonts-symbols",
    "noto-fonts",
    "noto-fonts-emoji",
]
aur_packages = []

[modules.theme]
enabled = true
configs = "gtk"
packages = ["adwaita-icon-theme"]
aur_packages = ["bibata-cursor-theme-bin"]

# Qt

[modules.qt]
enabled = true
configs = "qt"
# qt6ct/qt5ct is the Qt equivalent of the GTK settings.ini: it points Qt apps
# at a palette matugen regenerates with everything else. The style is Fusion
# rather than Kvantum on purpose — Kvantum themes need a hand-drawn SVG, while
# Fusion renders straight from the palette, which is the only part a wallpaper
# can actually generate.
packages = ["qt5ct", "qt6ct"]
# Two jobs. First, expand @HOME@ in the .conf.in files: qt5ct/qt6ct read
# color_scheme_path with QFile, which expands neither ~ nor $HOME, so the one
# absolute path in the config cannot be committed. Second, override VLC's
# desktop entry — VLC 3 is a Qt5 GUI, and QT_QPA_PLATFORMTHEME holds a single
# value that Qt5 and Qt6 disagree about. Regenerated from the system entry each
# run, so it follows VLC's own Exec line instead of pinning a stale copy.
hooks.post_install = [
    'sed "s|@HOME@|$HOME|g" $HOME/.config/qt6ct/qt6ct.conf.in > $HOME/.config/qt6ct/qt6ct.conf',
    'sed "s|@HOME@|$HOME|g" $HOME/.config/qt5ct/qt5ct.conf.in > $HOME/.config/qt5ct/qt5ct.conf',
    "mkdir -p $HOME/.local/share/applications",
    "sed 's|^Exec=/usr/bin/vlc|Exec=env QT_QPA_PLATFORMTHEME=qt5ct /usr/bin/vlc|' /usr/share/applications/vlc.desktop > $HOME/.local/share/applications/vlc.desktop",
]

# Secrets

[modules.secrets]
enabled = true
# gnome-keyring is the Secret Service every GTK/Electron app looks for:
# Nextcloud, Signal, VS Code, and libsecret-backed ssh keys. pam_gnome_keyring
# unlocks it with the login password — `dots doctor` checks that it is wired.
packages = ["gnome-keyring", "libsecret", "seahorse"]

# XDG: default applications and user directories

[modules.xdg]
enabled = true
configs = "xdg"
packages = ["xdg-utils", "xdg-user-dirs"]
hooks.post_install = ["xdg-user-dirs-update"]

# Audio / Bluetooth / Network

[modules.audio]
enabled = true
packages = ["pipewire", "pipewire-pulse", "wireplumber", "pavucontrol"]
hooks.post_install = ["systemctl --user enable --now pipewire pipewire-pulse wireplumber"]

[modules.bluetooth]
enabled = true
packages = ["bluez", "bluez-utils", "blueman", "bluetui"]
hooks.post_install = ["sudo systemctl enable --now bluetooth"]

[modules.network]
enabled = true
packages = ["networkmanager", "network-manager-applet", "tailscale"]
hooks.post_install = ["sudo systemctl enable --now NetworkManager"]

# Printing

[modules.printing]
enabled = true
packages = ["cups", "cups-pdf", "system-config-printer", "gutenprint"]
hooks.post_install = ["sudo systemctl enable --now cups.socket"]

# Power profiles

[modules.power]
enabled = true
# Backs `dots power` and the bar's profile indicator, which is silent while
# the profile is balanced.
packages = ["power-profiles-daemon"]
hooks.post_install = ["sudo systemctl enable --now power-profiles-daemon"]

# Files & clipboard

[modules.files]
enabled = true
# Nautilus rather than caja (declared but never installed) or Dolphin.
#
# The deciding factor is the toolkit, not the feature list. KDE apps read
# neither qt6ct's palette nor kdeglobals when Plasma is absent — verified by
# setting kdeglobals' window background to pure red and watching Dolphin come
# up grey anyway — so a KDE file manager would be the one window on the desktop
# that never follows the wallpaper. Nautilus is GTK4/libadwaita, which the
# existing gtk-colors.css template already themes.
#
# file-roller is GTK3, so it tracks the dark/light switch but not the accent.
# Acceptable for something opened twice a month; Nautilus extracts inline.
packages = ["udiskie", "gvfs", "nautilus", "file-roller"]

# CLI tools

[modules.cli]
enabled = true
packages = [
    "bat",
    "lsd",
    "fzf",
    "ripgrep",
    "fd",
    "btop",
    "htop",
    "lazygit",
    "git",
    "imagemagick",
    "screen",
    # checkupdates — backs the bar's pending-updates module
    "pacman-contrib",
]

# Development

[modules.dev]
enabled = true
packages = [
    "neovim",
    "gcc",
    "cmake",
    "pkg-config",
    "rustup",
    "nodejs",
    "npm",
    "python",
    "python-pip",
]
# aur_packages = ["visual-studio-code-bin"]
hooks.post_install = ["rustup default stable"]

# Applications

[modules.apps]
enabled = true
packages = [
    "firefox",
    "thunderbird",
    "nextcloud-client",
    "vlc",
    "ristretto",
    "gimp",
    "signal-desktop",
]
aur_packages = ["obsidian", "discord", "spotify-launcher", "slack-desktop-wayland"]
